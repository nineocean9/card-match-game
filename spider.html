<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>分类蜘蛛纸牌</title>
<style>
:root{
  --green:#087b40;--green-dark:#056333;--green-slot:#075e35;
  --card:#fffdf8;--ink:#51483f;--blue:#398fe9;--gold:#efc13b;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#087b40}
body{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;color:#fff;touch-action:none}
button{font:inherit}
.game{
  width:min(100vw,540px);height:100vh;margin:auto;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.035),transparent 28%),
    linear-gradient(145deg,#087f42,#08743d 54%,#086b38);
}
.level{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:150px;padding:7px 0;
  text-align:center;background:#056333;border-radius:25px;font-size:19px;font-weight:800;z-index:30;cursor:pointer}
.settings{position:absolute;left:28px;top:20px;width:46px;height:46px;border-radius:50%;
  border:0;background:#fff;color:#397fe5;font-size:26px;box-shadow:0 2px 4px #0002;z-index:30}
.settings:after{content:"";width:10px;height:10px;border-radius:50%;background:#ed4545;position:absolute;top:-2px;right:-2px;border:2px solid #fff}

.drawn-card{
  position:absolute;top:0;width:76px;height:105px;border-radius:10px;background:var(--card);color:var(--ink);
  border:3px solid #f3efe8;box-shadow:2px 3px 2px #0002;display:flex;align-items:center;justify-content:center;
  text-align:center;cursor:default;z-index:1;
}
.drawn-card.category-card{border-color:#e0a900;background:linear-gradient(145deg,#ffe77a,#efbd25);color:#604700}
.drawn-card.category-card .cat-title{font-size:20px;font-weight:900;color:#604700}
.drawn-card.category-card .cat-sub{font-size:10px;color:#8b6a18;margin-top:4px}
.drawn-card.top{cursor:grab;z-index:99}
.drawn-card .name{font-size:17px}.drawn-card .icon{font-size:29px}.drawn-card .tag{position:absolute;top:5px;left:6px;font-size:9px;color:#b09f8c}
.drawn-card.red{border-color:var(--gold)}
.empty-drawn{position:absolute;display:none;left:calc(50% - 91.5px);top:0;width:76px;height:105px;border:2px dashed #b8f0c855;border-radius:10px}

.combo{
  position:absolute; left:90px; top:88px; display:none; align-items:center; gap:8px;
  color:#347fe0; font-weight:bold; font-size:14px; z-index:30;
}
.combo.on{display:flex}
.combo .face{font-size:28px}
.combo strong{font-size:17px}
.bar{width:110px;height:8px;border:1px solid #fff;background:#265c8c;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:#8b64da;transition:.25s}

.status{position:absolute;top:145px;left:34px;right:34px;height:110px;display:flex;align-items:center;justify-content:space-between}
.steps{width:88px;height:105px;background:#fff;border:4px solid #f6f6f4;border-radius:9px;color:#347fe0;
  text-align:center;position:relative;overflow:hidden}
.steps:after{content:"";position:absolute;bottom:-1px;left:0;border-left:42px solid transparent;border-right:42px solid transparent;border-bottom:20px solid #087b3f}
.steps .h{background:#398ee9;color:#fff;font-weight:bold;padding:8px 0}.steps .n{font-size:35px;margin-top:7px}

.draw-area{width:250px;height:108px;position:relative;display:flex;align-items:center;justify-content:center;gap:7px}
.draw-pile{width:88px;height:105px;border-radius:10px;background:linear-gradient(135deg,#4da5f7,#1768d9);
  border:4px solid #fff;box-shadow:3px 4px 0 #b8d0d8;position:relative;display:grid;place-items:center;cursor:pointer;z-index:20}
.draw-pile:after{content:"?";font-size:50px;color:#6bc0ff55;font-weight:900}
.draw-pile span{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:13px;font-weight:bold;color:#fff;z-index:2}
.draw-pile.empty-shuffle{background:linear-gradient(145deg,#4fa5f5,#246bd9);border-color:#eaf6ff;box-shadow:3px 4px 0 #b8d0d8}
.draw-pile.empty-shuffle:before{content:"";width:58px;height:70px;border:2px solid #73b8fa66;border-radius:8px;transform:rotate(45deg);opacity:.7}
.draw-pile.empty-shuffle:after{content:"↻";position:absolute;font-size:38px;color:#fff;line-height:1;font-weight:900;text-shadow:0 2px 3px #0004;z-index:2}
.draw-pile.empty-shuffle span{bottom:5px;font-size:12px}
.draw-pile.pulse{animation:pulse .35s ease}
.drawn-stack{position:relative;left:-42px;right:auto;width:108px;height:105px;overflow:visible}
/* 抽牌堆中被盖住的已知词：跟随被盖牌自身的左侧露出区域，不漂到牌堆外。 */
.drawn-peek{position:absolute;top:14px;width:28px;height:76px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:12px;line-height:1;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;overflow:visible;pointer-events:none;z-index:200}
.drawn-peek.category-peek{font-weight:900;color:#604700}

.drawn-card.dragging{z-index:1000!important;cursor:grabbing;box-shadow:0 18px 35px #0006;transform:scale(1.04) rotate(1deg)}

.missions {
  position: absolute;
  left: 28px;
  right: 28px;
  top: 285px;
  height: 105px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  overflow: visible;
  touch-action: none;
  z-index: 1; /* 改为 1，低于 board */
}
.mission{position:relative;flex:1 1 0;min-width:0;width:auto;height:105px;box-sizing:border-box;border-radius:12px;background:#6e756f66;border:3px dashed #c7cdc9;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #ffffff12;transition:.2s;overflow:visible}
.mission.empty{background:#6e756f66}
.mission.locked{background:#6e756f2b;border-color:#c7cdc955;color:#c7cdc9;box-shadow:none;pointer-events:none}
.mission.locked .lock-icon{font-size:22px;opacity:.9}
.mission.has-card{background:transparent;border:0;box-shadow:none;color:var(--ink);overflow:visible}
/* 主题标签：保持原来的完整金色标签样式；卡面可以覆盖标签下部，但标签本身不被截断。 */
.mission .slot-title{position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:42px;box-sizing:border-box;border-radius:14px 14px 0 0;background:linear-gradient(145deg,#ffe77a,#efbd25);border:2px solid #e0a900;border-bottom:0;color:#604700;display:flex;align-items:flex-start;justify-content:center;padding-top:5px;z-index:4}
.mission .slot-title .cat-name{font-size:12px;font-weight:500;letter-spacing:.2px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mission .slot-word{position:absolute;left:50%;transform:translateX(-50%);top:0;width:100%;height:105px;box-sizing:border-box;border-radius:14px;background:var(--card);border:3px solid #e0a900;box-shadow:0 2px 3px #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;color:var(--ink);font-size:20px;font-weight:400;padding-top:26px;padding-bottom:4px;}
/* 词卡里的词:变细 + 水平居中 + 支持换行(x/N 计数固定顶部,不与词重叠) */
.mission .slot-word .name{font-weight:400;text-align:center;word-break:break-all;overflow-wrap:anywhere;line-height:1.25;max-width:100%;}
.mission .slot-word .icon{font-weight:400;line-height:1;}
.mission .slot-word.category-only{top:0;left:50%;transform:translateX(-50%);width:100%;height:105px;background:linear-gradient(145deg,#ffe77a,#efbd25);border:3px solid #e0a900;border-radius:12px;padding:10px}
.mission .slot-count{position:absolute;left:8px;top:6px;color:#6e685e;font-size:12px;font-weight:400;z-index:9;line-height:1}
.mission.over{transform:translateY(-5px);box-shadow:0 0 0 4px #fff8,0 5px 16px #0004}
.mission.done{animation:missionDone .55s ease}
.mission.flash{animation:missionFlash .65s ease}
.mission .category-center{font-size:20px;font-weight:900;color:#604700;text-align:center}
/* 修复：让 mission 在拖拽时提升层级，并确保内部元素不遮挡拖拽卡片 */
.mission.drag-over { z-index: 50; position: relative; }

.board{position:absolute;left:28px;right:28px;top:415px;bottom:118px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start;overflow:hidden;z-index:2}
.col{position:relative;min-height:430px;border-radius:12px;transition:.15s}
.col.inspect-target{background:#ffffff18;box-shadow:inset 0 0 0 2px #ffe36b88}
.col.target{background:#ffffff0a;box-shadow:inset 0 0 0 2px #b8f1cc44}
.card{
  width:76px;height:105px;border-radius:12px;background:var(--card);color:var(--ink);border:3px solid #f4f1eb;
  box-shadow:0 2px 2px #0002;position:absolute;left:calc(50% - 38px);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:8px;user-select:none;touch-action:none;transition:top .22s,left .18s,transform .18s,box-shadow .18s;
}
.card.faceup{cursor:grab}.card.faceup:hover{transform:translateY(-2px)}
.card.dragging{z-index:1000!important;cursor:grabbing;box-shadow:0 18px 35px #0006;transform:scale(1.04) rotate(1deg);transition:none}
.card.back{background:linear-gradient(145deg,#4fa5f5,#246bd9);border-color:#eaf6ff;cursor:default}.card.known{background:var(--card);border-color:#f4f1eb;cursor:default}
.card.back:before{content:"";width:58px;height:70px;border:2px solid #73b8fa66;border-radius:8px;transform:rotate(45deg);opacity:.55}
.card.selected{outline:4px solid #ffd44c;transform:translateY(-5px);z-index:50!important}
.card .tag{position:absolute;left:7px;top:6px;font-size:10px;color:#b29e8c}
.card .name{font-size:18px}.card .icon{font-size:32px}
.known-peek{position:absolute;left:50%;transform:translateX(-50%);width:68px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:16px;line-height:1;white-space:nowrap;overflow:hidden;pointer-events:none;z-index:200}
.card.red{border-color:var(--gold)}
.card.category-card{background:linear-gradient(145deg,#ffe77a,#efbd25);border-color:#e0a900;color:#604700}
.card.category-card .cat-title{font-size:20px;font-weight:900;color:#604700}
.card.category-card .cat-sub{font-size:10px;color:#8b6a18;margin-top:4px}
.card.flip{animation:cardRevealFlip .42s ease}
.drawn-card.flip{animation:cardRevealFlip .42s ease}
.card.perma-revealed{ }
.card.collecting{animation:collect .5s ease forwards}
.card.wrong{animation:wrongFlash .36s ease;filter:saturate(1.8) brightness(1.08);border-color:#ff3b30!important;box-shadow:0 0 0 3px #ff3b3088,0 0 22px #ff3b30aa!important}
@keyframes wrongFlash{0%{filter:saturate(1.8) brightness(1.08)}25%{filter:saturate(3) brightness(1.15)}55%{filter:saturate(2.5) brightness(1.1)}100%{filter:saturate(1) brightness(1)}}

.bottom{position:absolute;left:25px;right:25px;bottom:12px;height:90px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;z-index:20}
.action{border:0;background:transparent;color:white;font-weight:bold;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.action .ico{width:58px;height:58px;border-radius:18px;background:#fff;display:grid;place-items:center;color:#347ee1;font-size:30px;position:relative;box-shadow:0 2px 3px #0002}
.action:nth-child(2) .ico{color:#e88336}.action:nth-child(3) .ico{color:#7357df}.action:nth-child(4) .ico{color:#e44b55}
.plus{position:absolute;right:-6px;top:-7px;background:#ed4545;color:#fff;border-radius:50%;width:22px;height:22px;font-size:18px;line-height:21px}

.toast{position:absolute;left:50%;top:auto;bottom:108px;transform:translateX(-50%);background:#053f25ed;padding:9px 15px;border-radius:20px;
  font-size:13px;opacity:0;transition:.2s;z-index:2000;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

.inspect-mask{position:absolute;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;padding-top:150px;z-index:2500;pointer-events:none}
.inspect-mask.show{display:flex}
.inspect-panel{width:86%;max-height:55vh;background:#fff;border-radius:16px;padding:14px;color:var(--ink);box-shadow:0 10px 35px #0005;pointer-events:auto;overflow:hidden}
.inspect-title{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800;color:#056333;margin-bottom:10px}
.inspect-close{border:0;background:#eef3ef;border-radius:50%;width:30px;height:30px;font-size:18px;cursor:pointer}
.inspect-cards{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 8px}
.inspect-card{flex:0 0 58px;height:82px;border-radius:9px;border:2px solid #e5e0d8;background:var(--card);display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;font-size:13px;color:var(--ink)}
.inspect-card.back{background:linear-gradient(145deg,#4fa5f5,#246bd9);border-color:#eaf6ff;color:#fff}
.inspect-card.category{background:linear-gradient(145deg,#ffe77a,#efbd25);border-color:#e0a900;color:#604700;font-weight:800}
.deadlock-mask{position:absolute;inset:0;background:#0005;display:none;align-items:center;justify-content:center;z-index:2400;pointer-events:auto}
.deadlock-mask.show{display:flex}
.deadlock-panel{width:82%;background:#fff;border-radius:18px;padding:18px;color:var(--ink);box-shadow:0 12px 35px #0005;text-align:center}
.deadlock-panel h3{margin:0 0 8px;color:#056333;font-size:18px}.deadlock-panel p{margin:0 0 14px;font-size:13px;line-height:1.5;color:#52605a}
.deadlock-actions{display:flex;gap:10px}.deadlock-actions button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer}.deadlock-yes{background:#2f8d5b;color:#fff}.deadlock-no{background:#eef2ef;color:#486052}

/* 设置弹窗 */
.modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:3000}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;width:82%;max-height:78vh;overflow-y:auto;color:var(--ink)}
.modal h2{margin:0 0 14px;font-size:18px;color:#056333;text-align:center}
.srow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.slab{font-size:14px}
.stepper{display:flex;align-items:center;gap:10px}
.sbtn{width:28px;height:28px;border-radius:8px;background:#087b40;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sval{min-width:38px;text-align:center;font-size:15px;font-weight:700;color:#056333}
.switch{width:46px;height:26px;border-radius:15px;background:#ccc;position:relative;cursor:pointer;transition:.2s}
.switch .dot{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:#087b40}.switch.on .dot{left:22px}
.mbtn{border:0;border-radius:22px;font-size:15px;font-weight:700;padding:11px;cursor:pointer;margin-top:8px;width:100%}
.mbtn.primary{background:linear-gradient(135deg,#ffb648,#ff9f43);color:#fff}
.mbtn.ghost{background:#f0f0f0;color:#333}
.jump-row{display:flex;gap:8px;align-items:center}.jump-input{flex:1;min-width:0;height:40px;border:2px solid #dce4df;border-radius:10px;padding:0 12px;font-size:15px;color:var(--ink);outline:none}.jump-input:focus{border-color:#087b40}.jump-btn{width:88px;margin-top:0!important}
/* 关卡选择 */
.srow.levelSelect{flex-wrap:wrap;gap:8px;justify-content:flex-start;border:0}
.lvbtn{width:40px;height:36px;border-radius:8px;background:#087b40;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lvbtn.lock{background:#c9d2cd;color:#8a938e}
.lvbtn.cur{outline:3px solid #ffd44c}

@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes cardRevealFlip{0%{transform:perspective(500px) rotateY(0deg);filter:brightness(1)}45%{transform:perspective(500px) rotateY(90deg);filter:brightness(1.12)}100%{transform:perspective(500px) rotateY(0deg);filter:brightness(1)}}
@keyframes collect{to{transform:translate(var(--dx),var(--dy)) scale(.15) rotate(15deg);opacity:0}}
@keyframes missionDone{50%{transform:scale(1.08);box-shadow:0 0 25px #ffe36b99}}
@keyframes missionFlash{0%{filter:brightness(1)}35%{filter:brightness(2.2);box-shadow:0 0 0 5px #fff,0 0 30px #ffe36b}100%{filter:brightness(1)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:600px){
 .status{left:18px;right:18px;top:120px;height:96px}
 .steps{width:70px;height:94px;border-width:3px}.steps:after{border-left-width:32px;border-right-width:32px;border-bottom-width:17px}.steps .h{padding:6px 0;font-size:14px}.steps .n{font-size:32px;margin-top:5px}
 .draw-area{width:205px;height:96px;gap:5px}
 .drawn-stack{width:88px;height:94px;left:-42px}
 .drawn-peek{top:12px;width:28px;height:70px;font-size:11px}
 .draw-pile{width:72px;height:94px;border-width:3px}.draw-pile:after{font-size:45px}.draw-pile span{font-size:12px;bottom:4px}
 .empty-drawn{left:calc(50% - 74px);width:68px;height:94px}
 .missions{left:18px;right:18px;top:238px;height:94px;gap:6px}
 .mission{height:94px;border-width:2px}
 .mission .slot-title{position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:42px;box-sizing:border-box;border-radius:14px 14px 0 0;background:linear-gradient(145deg,#ffe77a,#efbd25);border:2px solid #e0a900;border-bottom:0;color:#604700;display:flex;align-items:flex-start;justify-content:center;padding-top:5px;z-index:4}.mission .slot-title .cat-name{font-size:10px}
 .mission .slot-word{position:absolute;left:50%;transform:translateX(-50%);top:0;width:100%;height:105px;box-sizing:border-box;border-radius:14px;background:var(--card);border:3px solid #e0a900;box-shadow:0 2px 3px #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;color:var(--ink);font-size:20px;font-weight:400;padding-top:26px;padding-bottom:4px;}.mission .slot-word.category-only{height:94px;border-width:2px;border-radius:10px;padding:7px}.mission .category-center{font-size:17px}.mission .slot-count{left:6px;top:5px;font-size:10px}.mission .slot-word .name{font-size:16px!important}.mission .slot-word .icon{font-size:28px!important}
 .board{left:18px;right:18px;top:356px;bottom:116px;gap:7px}
 .col{min-height:390px}
 .card{width:68px;height:94px;left:calc(50% - 34px);border-width:2px;border-radius:10px;padding:6px}.card .name{font-size:16px}.card .icon{font-size:29px}.card .tag{left:5px;top:5px;font-size:9px}.known-peek{width:62px;height:18px;font-size:15px}
 .drawn-card{width:68px;height:94px;border-width:2px;border-radius:10px}.drawn-card .name{font-size:16px}.drawn-card .icon{font-size:27px}.drawn-card .tag{top:4px;left:5px;font-size:9px}
 .bottom{left:18px;right:18px;bottom:10px;height:78px;gap:10px}.action{font-size:13px}.action .ico{width:52px;height:52px;border-radius:16px;font-size:27px}
 .inspect-mask{padding-top:125px}.inspect-panel{width:92%;max-height:58vh}
}
@media (min-height:1000px){
 .game{width:min(100vw,620px)}
 .level{top:26px}.settings{top:24px}
 .status{top:155px}.missions{top:305px}.board{top:440px;bottom:145px}.toast{top:auto;bottom:100px}
 .combo{top:105px;}
}
/* GitHub 卡牌视觉恢复：仅覆盖卡牌/主题槽内卡面样式，不覆盖游戏逻辑、道具、洗牌、撤回等其他修改。 */
.drawn-card{position:absolute;top:0;width:76px;height:105px;border-radius:10px;background:var(--card);color:var(--ink);border:3px solid #f3efe8;box-shadow:2px 3px 2px #0002;display:flex;align-items:center;justify-content:center;text-align:center;cursor:default;z-index:1}
.drawn-card.category-card{border-color:#e0a900;background:linear-gradient(145deg,#ffe77a,#efbd25);color:#604700}.drawn-card.category-card .cat-title{font-size:20px;font-weight:900;color:#604700}.drawn-card.category-card .cat-sub{font-size:10px;color:#8b6a18;margin-top:4px}.drawn-card.top{cursor:grab;z-index:99}.drawn-card .name{font-size:17px}.drawn-card .icon{font-size:29px}.drawn-card .tag{position:absolute;top:5px;left:6px;font-size:9px;color:#b09f8c}.drawn-card.red{border-color:var(--gold)}.drawn-card.dragging{z-index:1000!important;cursor:grabbing;box-shadow:0 18px 35px #0006;transform:scale(1.04) rotate(1deg)}

<body>

    <button class="mbtn primary" id="btnNextLevel">下一关</button>
    <button class="mbtn ghost" id="btnReplayLevel">重玩本关</button>
    <button class="mbtn ghost" id="btnWinHome">返回主菜单</button>
  </div>
</div>

<script>
// ===== mini CommonJS loader(加载 data/words.js 与 utils/levels.js) =====
const __modCache = {};
function resolvePath(from,to){const s=from.split('/').slice(0,-1);for(const p of to.split('/')){if(p==='.'||p==='')continue;if(p==='..'){s.pop();continue;}s.push(p);}return s.join('/');}
function ensureModule(name,srcs){if(__modCache[name])return __modCache[name].exports;const m={exports:{}};__modCache[name]=m;const f=new Function('module','exports','require','window',srcs[name]+'\n//# sourceURL='+name);f(m,m.exports,(r)=>ensureModule(resolvePath(name,r),srcs),window);return m.exports;}

const DEF_SET={themeCap:8,minNeed:3,maxNeed:7,stepCap:300,colCap:5,allowEmoji:true};
const $=id=>document.getElementById(id);
const store={load(){try{return JSON.parse(localStorage.getItem('spider_save'))||{maxUnlocked:1,settings:Object.assign({},DEF_SET)}}catch(e){return{maxUnlocked:1,settings:Object.assign({},DEF_SET)}}},save(d){try{localStorage.setItem('spider_save',JSON.stringify(d))}catch(e){}}};

let WORDS, L, currentLevel=1, maxUnlocked=1;
const state={steps:0,combo:0,stock:[],drawn:[],cols:[],missions:{},missionCards:[],drag:null,locked:false,dragHandlersInstalled:false,flashSlots:new Set(),flipIds:new Set(),nextGroupId:1,finishTopic:0,inspectMode:false,deadlockPrompted:false,undoSnapshot:null};
const icons={}; // 文字主题图标映射(主题名->图标),空则用文字

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}

async function boot(){
  const srcs={};
  // word1.js 是清理后的词库包装层，它仍需读取原始 words.js。
  // 因此这里必须同时预加载 words.js，否则启动时 require('./words.js') 会失败，
  // 导致 boot() 中断，表现为“点击开始后页面卡住且没有发牌”。
  for(const k of ['data/words.js','data/word1.js','utils/levels.js']) srcs[k]=await(await fetch(k)).text();
  WORDS=ensureModule('data/word1.js',srcs);
  L=ensureModule('utils/levels.js',srcs);
  const catById={};WORDS.forEach(w=>catById[w.id]=w);
  window.WORDS=WORDS;window.catById=catById;
  bindUI();
  const save=store.load();maxUnlocked=Math.max(1,save.maxUnlocked||1);const requested=Number(new URLSearchParams(location.search).get('level'));currentLevel=(requested>=1&&requested<=maxUnlocked)?requested:maxUnlocked;
  newGame(currentLevel);
}

function getSettings(){return store.load().settings}
function iconFor(name){return icons[name]||''}

// 依据关卡配置生成一副牌:每个主题 = 1分类卡 + N词卡
function makeDeck(level){
  const all=[];
  const catById=window.catById;
  level.themeNames.forEach(tn=>{
    const cat=catById[tn.id]; const need=level.require[tn.id];
    const words=(cat.w).slice(0,need); // 取 need 个
    all.push({id:uid(),type:'category',cat:tn.t,name:tn.t,face:true,kind:cat.kind});
    words.forEach(w=>all.push({id:uid(),type:'word',cat:tn.t,name:w,face:true,kind:cat.kind}));
  });
  return all.sort(()=>Math.random()-.5);
}
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function randomDistribution(total,count){
  // 5列时采用“阶梯式”分配，而不是完全随机撒牌：尽量让第5列最厚，
  // 前4列保持较轻；只有前4列每列不超过7张仍可实现时才使用这一策略。
  // 例如：30 → 4/5/6/7/8，31 → 5/5/6/7/8。
  // 当总牌数继续增加、前4列无法都压在7张以内时，自动以新的平均值
  // 重新计算5列，仍尽量保持相邻列相差1的阶梯形状。
  if(count===5){
    // 前四列最多各放7张；总牌数不超过28时，第5列必须完全留空。
    // 只有超过28张，才把多出来的牌分配到第5列。
    if(total<=28){
      const parts=Array(5).fill(0);
      const base=Math.floor(total/4),rem=total%4;
      for(let i=0;i<4;i++)parts[i]=base+(i>=4-rem?1:0);
      return parts;
    }
    const x=Math.floor((total-10)/5);
    const base=Math.max(0,x);
    const parts=[base,base+1,base+2,base+3,base+4];
    let remain=total-parts.reduce((a,b)=>a+b,0);
    // 把余数从左往右补，保持第5列始终不小于前面的列。
    for(let i=0;i<5&&remain>0;i++,remain--)parts[i]++;
    // 低牌量时避免出现0列；重新均衡到至少1张。
    while(parts.some(v=>v<1)){
      const i=parts.findIndex(v=>v<1);if(i<0)break;
      const j=parts.findIndex((v,k)=>k>i&&v>1);if(j<0)break;
      parts[i]++;parts[j]--;
    }
    return parts;
  }
  // 4列（前两关）保持近似均匀，避免改变教学关卡的牌量结构。
  const parts=Array(count).fill(Math.floor(total/count));
  for(let i=0;i<total%count;i++)parts[i]++;
  return parts;
}
function newGame(levelId){
  currentLevel=levelId;
  state.inspectMode=false;state.deadlockPrompted=false;state.undoSnapshot=null;state.flipIds.clear();
  $('deadlockMask')?.classList.remove('show');
  $('inspectMask')?.classList.remove('show');
  const level=L.makeLevel(levelId);
  const colCount=Math.max(4,Math.min(5,level.colCount)); // 默认4,可到5
  // 主题数量与同时可用的分类槽数量分离：界面永远显示5个槽，前期第5槽锁定。
  // 到10个主题这一档（约第8关）再开放第5槽，后续始终保持5槽。
  const activeSlotCount=level.themeNames.length>=10?5:4;
  const slotCount=5;
  const all=makeDeck(level);
  // 分类卡与词卡完全混合发牌：分类卡不再强制全部留在桌面。
  // 约60%的完整牌组进入桌面，其余进入抽牌堆；只保证至少一张分类卡初始可见。
  const shuffled=all.slice();
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
  // 关卡可指定桌面牌数量；未指定时沿用约60%的通用规则。
  const tableCount=Math.min(all.length-1,Math.max(colCount,level.tableCount ?? Math.round(all.length*0.6)));
  const table=shuffled.slice(0,tableCount);
  state.stock=shuffled.slice(tableCount);
  state.steps=level.steps; state.combo=0; state.drawn=[]; state.missions={}; state.missionCards=Array(slotCount).fill(null);
  state.activeSlotCount=activeSlotCount;
  state.drag=null; state.flashSlots=new Set(); state.nextGroupId=1; state.locked=false; state.finishTopic=slotCount;

  // 上桌牌随机分列(每列顶部一张 faceUp)
  const distribution=randomDistribution(table.length,colCount);
  state.cols=[];
  for(let c=0;c<colCount;c++)state.cols.push([]);
  const tableShuf=table.slice();for(let i=tableShuf.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tableShuf[i],tableShuf[j]]=[tableShuf[j],tableShuf[i]];}
  let cursor=0;
  for(let c=0;c<colCount;c++){
    for(let r=0;r<distribution[c];r++){
      const card=tableShuf[cursor++];
      if(!card)break;
      card.face=(r===distribution[c]-1);card.known=card.face;
      state.cols[c].push(card);
    }
  }
  // 只保证至少一张分类卡处于初始明牌位置，不再保证所有分类卡上桌。
  if(!state.cols.some(col=>col.at(-1)?.type==='category')){
    const ci=state.cols.findIndex(col=>col.some(card=>card.type==='category'));
    if(ci>=0){
      const col=state.cols[ci],pi=col.findIndex(card=>card.type==='category'),last=col.length-1;
      [col[pi],col[last]]=[col[last],col[pi]];
      // 开局重新确定列顶时，不能继承之前临时的 known 状态。
      // 否则原先的列顶牌被压回底下后仍会显示“已知词”，造成偶发开局信息泄露。
      col.forEach((card,i)=>{card.face=(i===col.length-1);card.known=card.face;});
    }
  }
  state.stockNeed=level.require; // {tid:n} 用于判定收集满
  state.topicNeed={}; level.themeNames.forEach(tn=>state.topicNeed[tn.t]=level.require[tn.id]);
  rebuildGroups();
  applyLayout(colCount,slotCount);
  render();
}
function applyLayout(colCount,slotCount){
  const missions=$('missions');
  missions.style.display='grid';
  // UI始终预留5个位置；activeSlotCount决定当前有几个可用。
  missions.style.gridTemplateColumns='repeat(5,minmax(0,1fr))';
  missions.style.gap='6px';
  $('board').style.gridTemplateColumns='repeat('+colCount+',1fr)';
  $('levelBtn').textContent='关卡 '+currentLevel;
}
function render(){
  $('steps').textContent=state.steps;
  $('deckText').textContent=(state.stock.length===0 && state.drawn.length)?'洗牌':'剩余 '+state.stock.length+' 张';
  $('drawPile').classList.toggle('empty-shuffle',state.stock.length===0 && state.drawn.length>0);
  renderMissions();renderDrawn();renderBoard();
  $('combo').classList.toggle('on',state.combo>0);
  $('comboN').textContent=Math.max(1,state.combo);
  $('comboBar').style.width=Math.min(100,35+state.combo*12)+'%';
}
function renderMissions(){
  const box=$('missions');box.innerHTML='';
  // 永远渲染5个槽位。未解锁的槽位是真正的 locked 槽，而不是缺少一个DOM节点。
  for(let si=0;si<5;si++){
    if(si>=state.activeSlotCount){
      const lock=document.createElement('div');
      lock.className='mission locked';
      lock.dataset.slot=si;
      lock.innerHTML='<div class="lock-icon">🔒</div>';
      box.appendChild(lock);
      continue;
    }
    const bucket=state.missionCards[si],placed=!!bucket?.categoryCard,got=bucket?.words?.length||0,latest=bucket?.words?.at(-1);
    const need=state.topicNeed[bucket?.cat]||7;
    const el=document.createElement('div');
    el.className='mission '+(placed?'has-card':'empty')+(state.flashSlots.has(si)?' flash':'');
    el.dataset.slot=si;
    if(placed){
      // 顶部横条页眉(只放主题名);进度 1/N 放回卡面(.slot-word)左上角
      const titleHtml=got>0?`<div class="slot-title"><span class="cat-name">${bucket.cat}</span></div>`:'';
      let bodyHtml='';
      if(got===0){
        bodyHtml=`<div class="slot-word category-only"><div class="category-center">${bucket.cat}</div><div class="slot-count">0/${need}</div></div>`;
      }else{
        const word=latest?.name||'';
        const iconHtml=latest&&latest.kind==='emoji'?`<div class="icon" style="font-size:32px;line-height:1">${word}</div>`
          :`<div class="name" style="font-size:18px;">${word}</div>`;
        bodyHtml=`<div class="slot-word"><div class="slot-count">${got}/${need}</div>${iconHtml}</div>`;
      }
      el.innerHTML=titleHtml+bodyHtml;
    }
    el.addEventListener('pointerup',e=>dropOnMission(si,e));
    box.appendChild(el);
  }
  if(state.flashSlots.size){state.flashSlots.clear();setTimeout(()=>render(),700);}
}
function renderDrawn(){
  const box=$('drawnStack');box.innerHTML='';
  $('emptyDrawn').style.display=state.drawn.length?'none':'block';
  const first=Math.max(0,state.drawn.length-3);
  const visible=state.drawn.slice(first);
  visible.forEach((card,localIndex)=>{
    const actualIndex=first+localIndex;
    const covered=actualIndex!==state.drawn.length-1;
    const el=document.createElement('div');
    el.className='drawn-card '+(actualIndex===state.drawn.length-1?'top':'')+(state.flipIds.has(card.id)?' flip':'');
    if(card.type==='category')el.classList.add('category-card');
    el.style.left=(localIndex*28)+'px';el.style.zIndex=localIndex+1;
    // 被盖住的已知词卡：卡面本身不再塞词，词条移动到牌与牌之间的侧边间隙。
    el.innerHTML=covered&&card.known&&(card.type==='word'||card.type==='category') ? '' : cardInner(card,true,false);
    if(actualIndex===state.drawn.length-1) attachDrag(el,{type:'drawn',index:actualIndex,card});
    box.appendChild(el);
    if(covered&&card.known&&card.type==='word'&&!card.permaReveal){
      const peek=document.createElement('div');
      peek.className='drawn-peek';
      peek.textContent=card.name;
      // 横向堆叠时只露出窄侧边：根据词长自动缩小竖排字号，确保完整显示，不再被固定高度截断。
      const peekLen=[...String(card.name||'')].length;
      if(peekLen>0) peek.style.fontSize=Math.min(12,Math.max(8,72/peekLen))+'px';
      if(card.type==='category')peek.classList.add('category-peek');
      peek.style.left=(localIndex*28)+'px';
      peek.style.zIndex=500+localIndex;
      box.appendChild(peek);
    }
  });
}
function cardInner(card,isDrawn,covered=false){

function getMovableRun(col,index){
  const card=col[index];if(!card||!card.face||card.type!=='word')return{start:index,end:index+1};
  let start=index,end=index+1;
  while(start>0){const x=col[start-1];if(!x.face||x.type!=='word'||x.cat!==card.cat)break;start--;}
  while(end<col.length){const x=col[end];if(!x.face||x.type!=='word'||x.cat!==card.cat)break;end++;}
  return{start,end};
}
function rebuildGroups(){

function attachDrag(el,data){

    if(data.type==='tableau'){
      const col=state.cols[data.col],card=data.card;

      if(card.type==='category'){moving=[card];elements=[el];}

function handleDropAt(x,y,e){

function dropOnMission(slotIndex){
  if(!state.drag)return;

    finishDrag();state.drag=null;render();toast('🔒 第5个分类槽将在后续关卡解锁');return;
  }

  }

function addMission(slotIndex,card){

function dropOnColumn(target){

function canPlace(card,target){
  if(!card||card.type!=='word')return false;

// 判断当前场上是否至少存在一个可以执行的“拖牌”动作。

function hasAnyCardMove(checkAllDrawn=false){
  if(state.locked)return false;
  const activeMissions=state.missionCards.slice(0,state.activeSlotCount);
  const drawnCandidates=checkAllDrawn?state.drawn:(state.drawn.length?[state.drawn.at(-1)]:[]);
  for(const topDrawn of drawnCandidates){
    if(topDrawn.type==='category' && activeMissions.some(s=>!s))return true;
    if(topDrawn.type==='word'){
      if(activeMissions.some(s=>s?.cat===topDrawn.cat))return true;
      if(state.cols.some((c,i)=>canPlace(topDrawn,i)))return true;
    }
  }
  for(let ci=0;ci<state.cols.length;ci++){
    const col=state.cols[ci],index=col.length-1,card=col[index];
    if(!card||!card.face)continue;
    if(card.type==='category'){
      if(activeMissions.some(s=>!s))return true;
      continue;
    }
    if(activeMissions.some(s=>s?.cat===card.cat))return true;
    for(let ti=0;ti<state.cols.length;ti++){
      if(ti===ci)continue;
      if(canPlace(card,ti))return true;
    }
  }

function autoShuffleIfStuck(){

  if(state.cols.length!==5 || state.cols.some(col=>col.length===0))return false;
  if(state.stock.length>0 || state.drawn.length===0)return false;

function confirmAutoShuffle(){

function autoShuffle(){
  const remaining=[...state.stock,...state.drawn,...state.cols.flat()];
  remaining.sort(()=>Math.random()-.5);
  const colCount=state.cols.length;
  // 真正死局时重新混合全部剩余牌；分类卡同样可以进入新的牌堆或抽牌堆。
  const tableCount=Math.max(colCount,Math.min(remaining.length,Math.round(remaining.length*.6)));

  const distribution=randomDistribution(table.length,colCount);
  state.stock=stock;state.drawn=[];state.cols=[];for(let c=0;c<colCount;c++)state.cols.push([]);
  let cursor=0;
  for(let c=0;c<colCount;c++){
    for(let r=0;r<distribution[c];r++){
      const card=table[cursor++];if(!card)break;
      card.face=(r===distribution[c]-1);card.known=card.face;delete card.groupId;
      state.cols[c].push(card);
    }
  }
  // 重新洗牌后也只保证至少一张分类卡可见，其他分类卡继续隐藏。

    }

  if(state.steps<=0){failGame('步数用尽，挑战失败！');return;}
  toast('当前无可移动牌，已自动洗牌');
}
function reveal(col){

function wrong(el){
  if(state.locked)return;
  // 错误落点：松手后立即脱离拖拽状态，不再跟随鼠标；从“当前错误落点”直接开始闪红并回到原位。
  const d=state.drag;
  const elements=d?.elements||[];
  const original=elements.map(x=>{
    const r=x.getBoundingClientRect();
    return {
      el:x,
      fromX:r.left,fromY:r.top,
      toX:Number(x.dataset._x),toY:Number(x.dataset._y),
      op:x.dataset._op||'',ol:x.dataset._ol||'',ot:x.dataset._ot||'',oz:x.dataset._oz||''
    };
  });

  state.shielded=false;

  state.drag=null;

  // 不恢复 position/left/top，也不 render，避免 CSS transition 被重置后从右下角或顶部“瞬移”。

    el.style.pointerEvents='none';
    el.style.position='fixed';
    el.style.left=fromX+'px';
    el.style.top=fromY+'px';
    el.style.margin='0';
    el.style.zIndex='9999';
    el.style.transition='none';
    el.classList.remove('wrong');

    requestAnimationFrame(()=>{

function showColumnInspect(ci){

  col.forEach(card=>{card.permaReveal=true;state.flipIds.add(card.id);});
  render();
  setTimeout(()=>col.forEach(card=>state.flipIds.delete(card.id)),450);
}
function closeInspect(){
  state.inspectMode=false;
  document.querySelectorAll('.col').forEach(x=>x.classList.remove('inspect-target'));
  $('inspectMask').classList.remove('show');
}
function shuffle(){
  const remaining=[...state.stock,...state.drawn,...state.cols.flat()];
  remaining.sort(()=>Math.random()-.5);
  const tableCount=state.cols.reduce((n,c)=>n+c.length,0);
  const colCount=state.cols.length;
  const distribution=randomDistribution(tableCount,colCount);
  const table=remaining.slice(0,tableCount);
  state.stock=remaining.slice(tableCount);
  state.drawn=[];
  state.cols=[];for(let c=0;c<colCount;c++)state.cols.push([]);
  state.nextGroupId=1;
  let cursor=0;
  for(let c=0;c<colCount;c++){
    for(let r=0;r<distribution[c];r++){
      const card=table[cursor++];if(!card)break;
      card.face=(r===distribution[c]-1);card.known=card.face;delete card.groupId;
      state.cols[c].push(card);
    }
  }
  rebuildGroups();state.locked=false;state.steps=Math.max(0,state.steps-1);state.combo=0;render();
  if(state.steps<=0){failGame('步数用尽，挑战失败！');return;}
  toast('已洗牌：抽牌堆、抽出牌和所有牌堆全部重新洗牌');
}
// ===== 设置 =====
function bindUI(){
  $('drawPile').onclick=drawCard;
  $('inspectBtn').onclick=inspectColumn;
  $('stepsBtn').onclick=addSteps;
  $('shuffleBtn').onclick=shuffle;
  $('undoBtn').onclick=undoMove;
  $('inspectClose').onclick=closeInspect;
  $('deadlockYes').onclick=confirmAutoShuffle;
  $('deadlockNo').onclick=dismissAutoShuffle;
  $('settingsBtn').onclick=openSettings;
  $('levelBtn').onclick=openSettings;
  $('btnCloseSet').onclick=closeSettings;
  $('btnHome').onclick=()=>location.href='index.html';
  $('btnJump').onclick=jumpToLevel;
  $('jumpLevelInput').addEventListener('keydown',e=>{if(e.key==='Enter')jumpToLevel();});
  $('btnResetProgress').onclick=resetProgress;
  $('btnNextLevel').onclick=()=>{closeWinDialog();newGame(currentLevel+1);};
  $('btnReplayLevel').onclick=()=>{closeWinDialog();newGame(currentLevel);};
  $('btnWinHome').onclick=()=>location.href='index.html';
  ['sound','vibration','confirmExit'].forEach(k=>{
    const el=$('sw-'+k); if(!el)return;
    el.onclick=()=>{const d=store.load();d.settings=d.settings||{};d.settings[k]=!(d.settings[k]===undefined?true:d.settings[k]);store.save(d);syncSettingsUI();};
  });
}
function showWinDialog(){
  $('winText').textContent='第 '+currentLevel+' 关完成，已解锁第 '+Math.max(maxUnlocked,currentLevel+1)+' 关';
  $('btnNextLevel').style.display='block';
  $('winMask').className='modal-mask show';
}
function closeWinDialog(){$('winMask').className='modal-mask';}
function jumpToLevel(){
  const input=$('jumpLevelInput');
  const level=Math.floor(Number(input.value));
  if(!Number.isFinite(level)||level<1){toast('请输入有效的关卡号');return;}
  closeSettings();
  newGame(level);
}
function resetProgress(){
  if(!confirm('确定要重置游戏进度吗？已解锁关卡将回到第 1 关。'))return;
  const d=store.load();
  d.maxUnlocked=1;
  store.save(d);
  location.href='index.html';
}
function syncSettingsUI(){
  const d=store.load(),s=d.settings||{};
  ['sound','vibration','confirmExit'].forEach(k=>{const v=s[k]===undefined?true:!!s[k];$('sw-'+k).className='switch'+(v?' on':'');});
  $('progressInfo').textContent='已解锁第 '+Math.max(1,d.maxUnlocked||1)+' 关';
}
function openSettings(){$('setMask').className='modal-mask show';syncSettingsUI();}
function closeSettings(){$('setMask').className='modal-mask';}

function toast(text){
  const t=$('toast');t.textContent=text;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1400);
}

boot();
</script>
