<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>卡牌分类消除</title>
<style>
:root{
  --bg:#2E9E57; --bg-deep:#1C5A34; --gold:#ffd700; --text:#1c2b1f; --muted:#6b7f6f;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;}
html,body{width:100%; height:100%;}
body{background:linear-gradient(180deg,var(--bg) 0%,#27904e 100%); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#fff; overflow:hidden;}
#app{display:flex; flex-direction:column; height:100vh; padding:8px; position:relative;}

/* 顶部 */
.top-bar{display:flex; justify-content:space-between; align-items:center; padding:4px 8px;}
.tb-left{display:flex; align-items:center; gap:10px;}
.tb-level{font-size:13px; opacity:.85;}
.tb-steps{font-size:15px; font-weight:700;}
.steps-num{font-size:22px; color:var(--gold); margin-left:3px;}
.gear{font-size:22px; background:rgba(255,255,255,.9); width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.2); cursor:pointer; color:#333;}

/* 抽牌堆(参考图:蓝牌 + 剩余N张叠在牌上) */
.deck-zone{display:flex; flex-direction:column; align-items:center; cursor:pointer;}
.deck-stack{width:58px; height:80px; border-radius:8px; position:relative; box-shadow:0 4px 10px rgba(0,0,0,.3); overflow:hidden;}
.deck-stack img{width:100%; height:100%; display:block;}
.deck-stack.empty{opacity:.4;}
.deck-badge{position:absolute; bottom:2px; left:0; right:0; text-align:center; font-size:11px; font-weight:800;
  color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); letter-spacing:.5px;}

/* 抽出的牌(抽牌堆:横向阶梯,左侧覆盖露出右侧,竖排文字) */
.drawn-row{display:flex; gap:3px; padding:6px 8px; min-height:76px; align-items:flex-start; overflow-x:auto; position:relative;}
.mini-card{width:52px; height:72px; border-radius:6px; position:relative; box-shadow:0 3px 8px rgba(0,0,0,.2); overflow:hidden; flex-shrink:0;}
.mini-card img{width:100%; height:100%; display:block;}
.mini-card .content{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:2px;}
.mini-card .content .word{font-size:12px; font-weight:700; color:#333; text-align:center; line-height:1.1;}
.mini-card .content .emoji{font-size:30px;}
/* 被覆盖的抽出的牌:竖排显示在右侧条带 */
.mini-card.cover .content{align-items:flex-end; justify-content:center;}
.mini-card.cover .content .word{writing-mode:vertical-rl; text-orientation:upright; font-size:12px; padding-right:3px; color:#333;}
.mini-card.cover .content .emoji{font-size:18px;}

/* 槽位 */
.slot-row{display:flex; gap:8px; padding:4px 8px;}
.slot-zone{flex:1; min-width:56px; height:88px; border-radius:9px; background:rgba(28,90,52,.75);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
.slot-empty{font-size:30px; opacity:.85;}
.slot-card{width:100%; height:100%; position:relative; overflow:hidden;}
.slot-card img{position:absolute; inset:0; width:100%; height:100%;}
.slot-card-body{position:relative; z-index:1; width:100%; height:100%; display:flex; flex-direction:column; padding:3px;}
.slot-head{background:#ffe3ae; color:#8a5300; font-size:10px; font-weight:700; text-align:center; padding:1px 0; border-radius:5px; white-space:nowrap; overflow:hidden;}
.slot-progress-row{display:flex; justify-content:space-between; align-items:center; padding:1px 4px;}
.slot-count{font-size:11px; font-weight:800; color:#ff7a45;}
.slot-crown-sm{font-size:10px;}
.slot-title{font-size:12px; font-weight:800; color:#8a5300; text-align:center; overflow:hidden; max-height:17px;}
.slot-title .emoji-lg{font-size:16px;}
.slot-cards{display:flex; gap:3px; flex-wrap:wrap; justify-content:center;}
.slot-inner-card{width:24px; height:32px; border-radius:4px; position:relative; overflow:hidden;}
.slot-inner-card img{position:absolute; inset:0; width:100%; height:100%;}
.slot-inner-content{position:relative; z-index:1; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
.slot-inner-content .emoji-md{font-size:16px;}
.slot-inner-content .word-md{font-size:8px; color:#333;}
/* 凑齐动画 */
.slot-zone.completing{animation:slotPop .7s ease;}
@keyframes slotPop{0%{transform:scale(1);}40%{transform:scale(1.18); filter:brightness(1.5);}100%{transform:scale(1);}}

/* 牌堆区(纵向阶梯堆叠:上下错开,底部露出名牌) */
.board{flex:1; display:flex; gap:8px; padding:8px; align-items:flex-end; justify-content:space-around;}
.pile-zone{position:relative;}
.pile-stack{position:relative;}
.pile-card{position:absolute; left:0; top:0; width:56px; height:88px; border-radius:7px;
  box-shadow:0 3px 8px rgba(0,0,0,.18); overflow:hidden; transition:top .2s ease;}
.pile-card img{position:absolute; inset:0; width:100%; height:100%;}
.pile-card .content{position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; padding:2px;}
/* 完整牌(列中未被覆盖的一张):横排 */
.pile-card .content .word{font-size:13px; font-weight:700; color:#333; text-align:center; line-height:1.1;}
.pile-card .content .emoji{font-size:30px;}
.pile-card.theme .content .word{color:#8a5300; font-size:11px;}
/* 被覆盖的已揭示牌:竖排显示在露出条带 */
.pile-card.cover .content{align-items:flex-end; justify-content:center;}
.pile-card.cover .content .word{writing-mode:vertical-rl; text-orientation:upright; font-size:12px; padding-right:3px; color:#333; line-height:1;}
.pile-card.cover .content .emoji{font-size:18px;}
.pile-card.cover.theme .content .word{color:#8a5300;}

/* 临时卡槽 */
.temp-zone{margin:6px; background:rgba(28,90,52,.8); border-radius:8px; padding:8px;}
.temp-label{font-size:10px; color:rgba(255,255,255,.8); margin-bottom:5px;}
.temp-stack{display:flex; gap:5px; flex-wrap:wrap; min-height:46px;}
.temp-card{width:40px; height:56px; border-radius:5px; position:relative; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,.2);}
.temp-card img{width:100%; height:100%; display:block;}
.temp-content{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.temp-content .word{font-size:10px; font-weight:700; color:#333;}
.temp-content .emoji{font-size:24px;}

/* 道具栏 */
.tools{display:flex; justify-content:space-around; padding:6px 4px 12px;}
.tool{display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; transition:transform .15s;}
.tool:active{transform:scale(.92);}
.tool-icon{font-size:24px; background:rgba(255,255,255,.92); width:46px; height:46px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,.25);}
.tool-active .tool-icon{background:#ffd700;}
.tool-label{font-size:10px;}

/* 拖拽 ghost */
.drag-ghost{position:fixed; pointer-events:none; z-index:9999; transform:translate(-50%,-50%);}
.ghost-stack{display:flex; flex-direction:column; align-items:center;}
.ghost-card{width:64px; height:96px; border-radius:7px; position:relative; box-shadow:0 8px 20px rgba(0,0,0,.4); opacity:.92; overflow:hidden; transition:margin-top .12s;}
.ghost-card img{width:100%; height:100%; display:block;}
.ghost-content{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.ghost-content .word{font-size:14px; font-weight:700; color:#333;}
.ghost-content .emoji{font-size:34px;}

/* 结果 */
.result-mask{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:10000;}
.result-mask.show{display:flex;}
.result-box{background:#fff; border-radius:12px; padding:28px; text-align:center; width:70%;}
.result-title{font-size:22px; font-weight:800; color:#1c5a34;}
.result-sub{font-size:13px; color:var(--muted); margin:10px 0 18px;}
.result-actions{display:flex; gap:10px; justify-content:center;}
.btn{border-radius:22px; font-size:13px; font-weight:700; padding:11px 18px; border:none; cursor:pointer; line-height:1.3;}
.btn-ghost{background:#f0f0f0; color:#333;}
.btn-main{background:linear-gradient(135deg,#ffb648,#ff9f43); color:#fff;}
.toast{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.8); color:#fff;
  padding:10px 18px; border-radius:20px; font-size:13px; z-index:20000; display:none;}

/* 设置弹窗 */
.set-mask{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:10001;}
.set-mask.show{display:flex;}
.set-box{background:#fff; border-radius:14px; padding:22px; width:82%; max-height:80vh; overflow-y:auto; color:#333;}
.set-title{font-size:18px; font-weight:800; color:#1c5a34; margin-bottom:14px; text-align:center;}
.set-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid #f0f0f0;}
.set-label{font-size:13px;}
.stepper{display:flex; align-items:center; gap:10px;}
.step-btn{width:28px; height:28px; border-radius:7px; background:#2e9e57; color:#fff; font-size:18px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;}
.step-val{min-width:34px; text-align:center; font-size:14px; font-weight:700; color:#1c5a34;}
.switch{width:44px; height:24px; border-radius:14px; background:#ccc; position:relative; cursor:pointer; transition:background .2s;}
.switch .dot{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s;}
.switch.on{background:#2e9e57;}
.switch.on .dot{left:22px;}
.set-actions{margin-top:16px; display:flex; flex-direction:column; gap:10px;}
.set-actions .btn-main{width:100%;}
.danger{background:#fff; color:#d9534f;}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="tb-left">
      <div class="gear" id="btnSettings">⚙️</div>
      <div class="tb-level">第 <span id="levelId">1</span> 关</div>
      <div class="tb-steps">步数<span class="steps-num" id="steps">0</span></div>
    </div>
    <div class="deck-zone" id="deckZone">
      <div class="deck-stack" id="deckStack"><img src="images/deck-back.png" alt="抽牌堆"><div class="deck-badge" id="deckCount">剩余 0 张</div></div>
    </div>
  </div>

  <!-- 已抽出 -->
  <div class="drawn-row" id="drawnRow"></div>

  <!-- 槽位 -->
  <div class="slot-row" id="slotRow"></div>

  <!-- 牌堆 -->
  <div class="board" id="board"></div>

  <!-- 临时卡槽 -->
  <div class="temp-zone">
    <div class="temp-label">临时卡槽</div>
    <div class="temp-stack" id="tempStack"></div>
  </div>

  <!-- 道具 -->
  <div class="tools">
    <div class="tool" id="toolHint"><div class="tool-icon">💡</div><div class="tool-label">提示</div></div>
    <div class="tool" id="toolRecall"><div class="tool-icon">📥</div><div class="tool-label">收牌</div></div>
    <div class="tool" id="toolShuffle"><div class="tool-icon">🔀</div><div class="tool-label">洗牌</div></div>
    <div class="tool" id="toolWild"><div class="tool-icon">🎭</div><div class="tool-label">万能牌</div></div>
  </div>
</div>

<div class="drag-ghost" id="dragGhost"><div class="ghost-stack" id="ghostStack"></div></div>
<div class="result-mask" id="resultMask">
  <div class="result-box">
    <div class="result-title" id="resultTitle">恭喜过关</div>
    <div class="result-sub" id="resultSub">所有主题已收集</div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="btnRestart">重开</button>
      <button class="btn btn-main" id="btnClose">返回</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="set-mask" id="setMask">
  <div class="set-box">
    <div class="set-title">游戏设置</div>
    <div class="set-row"><div class="set-label">每关主题数(上限)</div>
      <div class="stepper"><div class="step-btn" data-k="themeCap" data-d="-1">−</div><div class="step-val" id="v-themeCap">8</div><div class="step-btn" data-k="themeCap" data-d="1">＋</div></div></div>
    <div class="set-row"><div class="set-label">每主题最少词(0/N)</div>
      <div class="stepper"><div class="step-btn" data-k="minNeed" data-d="-1">−</div><div class="step-val" id="v-minNeed">3</div><div class="step-btn" data-k="minNeed" data-d="1">＋</div></div></div>
    <div class="set-row"><div class="set-label">每主题最多词(0/N)</div>
      <div class="stepper"><div class="step-btn" data-k="maxNeed" data-d="-1">−</div><div class="step-val" id="v-maxNeed">9</div><div class="step-btn" data-k="maxNeed" data-d="1">＋</div></div></div>
    <div class="set-row"><div class="set-label">步数上限</div>
      <div class="stepper"><div class="step-btn" data-k="stepCap" data-d="-10">−</div><div class="step-val" id="v-stepCap">300</div><div class="step-btn" data-k="stepCap" data-d="10">＋</div></div></div>
    <div class="set-row"><div class="set-label">牌堆列数(上限)</div>
      <div class="stepper"><div class="step-btn" data-k="colCap" data-d="-1">−</div><div class="step-val" id="v-colCap">5</div><div class="step-btn" data-k="colCap" data-d="1">＋</div></div></div>
    <div class="set-row"><div class="set-label">槽位数量(0=跟随主题)</div>
      <div class="stepper"><div class="step-btn" data-k="slotCount" data-d="-1">−</div><div class="step-val" id="v-slotCount">0</div><div class="step-btn" data-k="slotCount" data-d="1">＋</div></div></div>
    <div class="set-row"><div class="set-label">允许 Emoji 主题</div>
      <div class="switch" id="sw-allowEmoji"><div class="dot"></div></div></div>
    <div class="set-actions">
      <button class="btn btn-main" id="btnSaveSettings">保存并重开</button>
      <button class="btn btn-ghost danger" id="btnResetLevels">重置进度</button>
      <button class="btn btn-ghost" id="btnCloseSettings">关闭</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== mini CommonJS loader =====
const __modCache = {};
function resolvePath(from, to){
  const stack = (from.split('/')).slice(0,-1);
  const parts = to.split('/');
  for (const p of parts){ if (p === '.' || p === '') continue; if (p === '..'){ stack.pop(); continue; } stack.push(p); }
  return stack.join('/');
}
function ensureModule(name, srcs){
  if (__modCache[name]) return __modCache[name].exports;
  const module = { exports: {} };
  __modCache[name] = module;
  const src = srcs[name];
  const fn = new Function('module', 'exports', 'require', 'window', src + '\n//# sourceURL=' + name);
  fn(module, module.exports, function(req){ return ensureModule(resolvePath(name, req), srcs); }, window);
  return module.exports;
}

const DEF_SET = {themeCap:8, minNeed:3, maxNeed:9, stepCap:300, colCap:5, allowEmoji:true, slotCount:0};

async function boot(){
  const srcs = {};
  const files = {
    'data/words.js': 'data/words.js',
    'utils/engine.js': 'utils/engine.js',
    'utils/levels.js': 'utils/levels.js',
  };
  for (const k of Object.keys(files)) { srcs[k] = await (await fetch(files[k])).text(); }
  const WORDS = ensureModule('data/words.js', srcs);
  const E = ensureModule('utils/engine.js', srcs);
  const L = ensureModule('utils/levels.js', srcs);
  window.WORDS = WORDS; window.E = E; window.L = L;
  const store = {
    load(){ try { return JSON.parse(localStorage.getItem('card_match')) || { maxUnlocked:1, settings:Object.assign({},DEF_SET) }; } catch(e){ return { maxUnlocked:1, settings:Object.assign({},DEF_SET) }; } },
    seth(){},
  };
  const catalogById = {};
  WORDS.forEach(w => catalogById[w.id] = w);

  let state, level, currentLevel = 1, maxUnlocked = 1, dragBatch = null;
  const $ = id => document.getElementById(id);

  function getSettings(){ return store.load().settings; }

  function newGame(levelId){
    const s0 = getSettings();
    level = L.makeLevel(levelId, {
      themeCount: s0.themeCap, minNeed: s0.minNeed, maxNeed: s0.maxNeed,
      stepCap: s0.stepCap, colCount: s0.colCap, allowEmoji: s0.allowEmoji,
    });
    const cat = {}; level.themes.forEach(id => cat[id] = catalogById[id]);
    state = E.buildLevel(level, cat);
    const slotCount = (s0.slotCount > 0) ? s0.slotCount : (level.slotCount || level.themes.length);
    state = E.initSlots(state, slotCount);
    return state;
  }

  // ---- 渲染 ----
  function render(){
    const s = state;
    $('levelId').textContent = currentLevel;
    $('steps').textContent = s.steps;
    $('deckCount').textContent = s.deck.length > 0 ? '剩余 '+s.deck.length+' 张' : '已空';
    $('deckStack').className = 'deck-stack' + (s.deck.length ? '' : ' empty');

    // 槽位
    const slotRow = $('slotRow'); slotRow.innerHTML = '';
    s.slots.forEach((slot, i) => {
      const th = slot.tid ? s.themes.find(x => x.id === slot.tid) : null;
      const zone = document.createElement('div');
      zone.className = 'slot-zone' + (slot.tid ? ' active' : '') + (slot.done ? ' completing' : '');
      if (!slot.tid) {
        zone.innerHTML = '<div class="slot-empty">🎓</div>';
      } else {
        zone.innerHTML =
          '<div class="slot-card"><img src="images/theme-card.png">' +
          '<div class="slot-card-body">' +
          '<div class="slot-head">'+th.t+'</div>' +
          '<div class="slot-progress-row"><span class="slot-count">'+th.collected+'/'+th.need+'</span><span class="slot-crown-sm">👑</span></div>' +
          '<div class="slot-title">'+ (th.kind==='emoji'?'<span class="emoji-lg">'+th.t+'</span>':th.t) +'</div>' +
          '<div class="slot-cards">'+ slot.cards.slice(1).map(c=>'<div class="slot-inner-card"><img src="images/card-front.png"><div class="slot-inner-content">'+(c.kind==='emoji'?'<span class="emoji-md">'+c.word+'</span>':'<span class="word-md">'+c.word+'</span>')+'</div></div>').join('') +'</div>' +
          '</div></div>';
      }
      slotRow.appendChild(zone);
    });

    // 牌堆(纵向阶梯:front(可拖)在最下方完整横排,被盖住的牌向上错开,露出顶部条带;蓝背未翻开)
    const board = $('board'); board.innerHTML = '';
    s.piles.forEach(pile => {
      const pzone = document.createElement('div');
      pzone.className = 'pile-zone';
      const stack = document.createElement('div');
      stack.className = 'pile-stack';
      const step = 12;
      const w = 56, h = 88;
      const front = pile.length - 1; // 栈顶(可拖,faceUp)
      stack.style.width = w + 'px';
      stack.style.height = (h + (pile.length-1)*step) + 'px';
      pzone.style.width = w + 'px';
      pile.forEach((c, idx) => {
        const card = document.createElement('div');
        card.className = 'pile-card' + (c.role==='theme'?' theme':'');
        const reveal = c.faceUp || c.revealed;
        const isFront = (idx === front);
        // front(idx 最大) 在 top 最大(最下)且 zIndex 最大(盖最上);其余向上错开
        card.style.top = (idx * step) + 'px';
        card.style.zIndex = idx;
        card.dataset.id = c.id;
        if (!isFront && reveal) card.className += ' cover';
        const img = reveal ? (c.role==='theme'?'images/theme-card.png':'images/card-front.png') : 'images/deck-back.png';
        let content = '';
        if (reveal) {
          content = c.kind==='emoji' ? '<span class="emoji">'+c.word+'</span>' : '<span class="word">'+c.word+'</span>';
        }
        card.innerHTML = '<img src="'+img+'"><div class="content">'+content+'</div>';
        card.addEventListener('mousedown', onDragStart);
        card.addEventListener('touchstart', onTouchStart, {passive:false});
        stack.appendChild(card);
      });
      pzone.appendChild(stack);
      board.appendChild(pzone);
    });

    // 抽牌堆(横向阶梯:最早抽出的在最左完整横排,后抽的向右被盖,露出右侧条带竖排)
    const shownDrawn = s.drawn.slice(-5); // 最多显示最近5张
    const drawnRow = $('drawnRow'); drawnRow.innerHTML = '';
    shownDrawn.forEach((c, idx) => {
      const isFirst = (idx === 0); // 最左一张完整
      const el = document.createElement('div');
      el.className = 'mini-card' + (isFirst ? '' : ' cover');
      el.dataset.id = c.id;
      const img = c.role==='theme'?'images/theme-card.png':'images/card-front.png';
      const content = c.kind==='emoji'?('<span class="emoji">'+c.word+'</span>'):('<span class="word">'+c.word+'</span>');
      el.innerHTML = '<img src="'+img+'"><div class="content">'+content+'</div>';
      el.addEventListener('mousedown', onDragStart);
      el.addEventListener('touchstart', onTouchStart, {passive:false});
      drawnRow.appendChild(el);
    });

    // 临时卡槽
    const tempStack = $('tempStack'); tempStack.innerHTML = '';
    s.tempSlot.forEach(c => {
      const el = document.createElement('div');
      el.className = 'temp-card';
      el.dataset.id = c.id;
      const img = c.role==='theme'?'images/theme-card.png':'images/card-front.png';
      const content = c.kind==='emoji'?('<span class="emoji">'+c.word+'</span>'):('<span class="word">'+c.word+'</span>');
      el.innerHTML = '<img src="'+img+'"><div class="temp-content">'+content+'</div>';
      el.addEventListener('mousedown', onDragStart);
      el.addEventListener('touchstart', onTouchStart, {passive:false});
      tempStack.appendChild(el);
    });

    $('toolRecall').className = s.freePlace ? 'tool tool-active' : 'tool';
    const res = E.settle(s);
    if (res.finished) handleFinish(res.win);
  }

  // ---- 拖拽 ----
  function onTouchStart(e){ e.preventDefault(); onDragStartFrom(e.touches[0], e.currentTarget); }
  function onTouchMove(e){ e.preventDefault(); onDragMove(e.touches[0]); }
  function onTouchEnd(e){ onDragEnd(e.changedTouches[0]); }
  function onDragStart(e){ onDragStartFrom({clientX:e.clientX, clientY:e.clientY}, e.currentTarget); }
  function onDragStartFrom(pt, el){
    if (state.finished) return;
    const id = el.dataset.id;
    if (!E.isDraggable(state, id)) return;
    const tile = E.locate(state, id).tile;
    dragBatch = E.collectBatch(state, id);
    dragX = pt.clientX; dragY = pt.clientY;
    buildGhost(dragBatch);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchmove', onDragMove, {passive:false});
    document.addEventListener('touchend', onDragEnd);
  }
  let dragX=0, dragY=0;
  function buildGhost(batch){
    const gs = $('ghostStack'); gs.innerHTML = '';
    batch.tiles.forEach((t,i) => {
      const el = document.createElement('div');
      el.className = 'ghost-card' + (t.role==='theme'?' theme':'');
      el.style.marginTop = i>0 ? '-64px' : '0';
      const img = t.role==='theme'?'images/theme-card.png':'images/card-front.png';
      const content = t.kind==='emoji'?'<span class="emoji">'+t.word+'</span>':'<span class="word">'+t.word+'</span>';
      el.innerHTML = '<img src="'+img+'"><div class="ghost-content">'+content+'</div>';
      gs.appendChild(el);
    });
  }
  function onDragMove(pt){ dragX=pt.clientX; dragY=pt.clientY; const g=$('dragGhost'); g.style.left=dragX+'px'; g.style.top=dragY+'px'; g.style.display='block'; }
  function onDragEnd(pt){
    const ghost=$('dragGhost'); ghost.style.display='none';
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend', onDragEnd);
    if (!dragBatch) return;
    const target = hitTarget(pt.clientX, pt.clientY);
    const batch = dragBatch; dragBatch = null;
    if (!target){ render(); return; }
    handleDrop(batch, target);
  }
  function hitTarget(x, y){
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const slotZone = el.closest('.slot-zone');
    if (slotZone) { return { type:'slot', index: Array.from($('slotRow').children).indexOf(slotZone) }; }
    const pileZone = el.closest('.pile-zone');
    if (pileZone) { return { type:'pile', index: Array.from($('board').children).indexOf(pileZone) }; }
    if (el.closest('.temp-zone')) return { type:'temp' };
    return null;
  }
  function handleDrop(batch, target){
    const r = E.placeBatch(state, batch, target);
    if (r.ok){
      if (r.steps) E.step(state, r.steps);
      E.flushSlots(state); E.clearFree(state);
      // 凑齐动画:若有槽位 done,加 completing 类播放后移除
      if (r.event === 'collect') triggerSlotPop();
    } else {
      if (r.steps) E.step(state, r.steps);
      E.clearFree(state);
      if (r.event !== 'notfound') toast({slotbusy:'槽位已被占用',wrongtheme:'主题不符',ontheme:'不能放在主题卡上',wrongpile:'不同主题',themetopile:'主题卡请放槽位',notfound:'无效',themeroll:'主题卡必须单张'}[r.event]||'无法放置');
    }
    render();
  }
  function triggerSlotPop(){
    // 播放一次凑齐动画
    setTimeout(()=>{ const zones=document.querySelectorAll('.slot-zone.completing'); zones.forEach(z=>z.classList.remove('completing')); }, 800);
  }

  // ---- 抽牌/道具 ----
  $('deckZone').addEventListener('click', ()=>{
    if (state.finished) return;
    const r = E.draw(state);
    if (r.ok){ $('deckStack').classList.add('pulse'); setTimeout(()=>$('deckStack').classList.remove('pulse'),200); render(); }
    else if (r.event==='emptydeck') toast('牌堆已空');
  });
  $('toolHint').addEventListener('click', ()=>{
    if (state.finished) return;
    for (const t of E.draggableTiles(state)){
      const th = state.themes.find(x=>x.id===t.tid);
      if (t.role==='theme'){ toast('把「'+t.word+'」拖入空槽位'); return; }
      if (th && !th.done){ toast('把「'+t.word+'」拖入「'+th.t+'」'); return; }
    }
    toast('先抽牌或整理');
  });
  $('toolShuffle').addEventListener('click', ()=>{
    if (state.finished) return;
    E.shuffleAll(state, { colCount: state.colCount });
    render(); toast('已洗牌');
  });
  $('toolRecall').addEventListener('click', ()=>{
    if (state.finished) return;
    E.reclaim(state);
    render(); toast('收牌:选一张牌放到任意位置');
  });
  $('toolWild').addEventListener('click', ()=> toast('万能牌(示例)'));

  // ---- 设置 ----
  const setCur = ()=>{ const s=getSettings(); return { themeCap:s.themeCap, minNeed:s.minNeed, maxNeed:s.maxNeed, stepCap:s.stepCap, colCap:s.colCap, slotCount:s.slotCount, allowEmoji:s.allowEmoji }; };
  function openSettings(){
    const v = setCur();
    $('v-themeCap').textContent=v.themeCap; $('v-minNeed').textContent=v.minNeed; $('v-maxNeed').textContent=v.maxNeed;
    $('v-stepCap').textContent=v.stepCap; $('v-colCap').textContent=v.colCap; $('v-slotCount').textContent=v.slotCount||'auto';
    $('sw-allowEmoji').className='switch'+(v.allowEmoji?' on':'');
    $('setMask').className='set-mask show';
  }
  function closeSettings(){ $('setMask').className='set-mask'; }
  $('btnSettings').addEventListener('click', openSettings);
  $('btnCloseSettings').addEventListener('click', closeSettings);
  // 步进器
  document.querySelectorAll('.step-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k=btn.dataset.k, d=Number(btn.dataset.d);
      const v=setCur(); const bounds={themeCap:[1,12],minNeed:[3,9],maxNeed:[3,12],stepCap:[20,500],colCap:[3,7],slotCount:[0,12]};
      let nv=(v[k]||0)+d; const b=bounds[k]; if(b) nv=Math.max(b[0],Math.min(b[1],nv));
      const save=store.load(); save.settings[k]=nv; saveSettings(save);
      v[k]=nv; $('v-'+k).textContent = (k==='slotCount'&&nv===0)?'auto':nv;
    });
  });
  $('sw-allowEmoji').addEventListener('click', ()=>{
    const save=store.load(); save.settings.allowEmoji=!save.settings.allowEmoji; saveSettings(save);
    $('sw-allowEmoji').className='switch'+(save.settings.allowEmoji?' on':'');
  });
  $('btnSaveSettings').addEventListener('click', ()=>{
    // 用当前设置重开当前关
    newGame(currentLevel); render(); closeSettings(); toast('已保存');
  });
  $('btnResetLevels').addEventListener('click', ()=>{
    const d={maxUnlocked:1, settings:Object.assign({},DEF_SET)}; saveSettings(d);
    maxUnlocked=1; currentLevel=1; newGame(1); render(); closeSettings(); toast('已重置');
  });
  function saveSettings(save){ try{ localStorage.setItem('card_match', JSON.stringify(save)); }catch(e){} }

  // ---- 胜负 ----
  function toast(text){ const t=$('toast'); t.textContent=text; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',1100); }
  function handleFinish(win){
    $('resultTitle').textContent = win ? '恭喜过关！' : '游戏结束';
    $('resultSub').textContent = win ? '所有主题已收集' : '步数用尽';
    $('resultMask').className = 'result-mask show';
    if (win && currentLevel+1 > maxUnlocked){ maxUnlocked = currentLevel+1; saveSettings({maxUnlocked, settings:getSettings()}); }
  }
  $('btnRestart').addEventListener('click', ()=>{ $('resultMask').className='result-mask'; newGame(currentLevel); render(); });
  $('btnClose').addEventListener('click', ()=>{ $('resultMask').className='result-mask'; });

  document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
  newGame(1);
  render();
}
boot();
</script>
</body>
</html>
