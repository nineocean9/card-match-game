<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>卡牌分类消除</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}
    body{background:linear-gradient(145deg,#087f42,#086b38);color:#fff;display:flex;align-items:center;justify-content:center}
    .main{width:min(100%,620px);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 28px;position:relative}
    .logo{font-size:58px;margin-bottom:12px}h1{margin:0;font-size:30px;letter-spacing:2px;font-weight:900}.sub{margin:10px 0 42px;opacity:.78;font-size:14px}
    .menu{width:min(360px,100%);display:flex;flex-direction:column;gap:14px}.menu button{height:58px;border:0;border-radius:18px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 5px 12px #0003}
    .start{background:linear-gradient(135deg,#ffbf52,#ff9e43);color:#fff}.secondary{background:#fff;color:#17683f}.settings{background:#0b6338;color:#fff;border:1px solid #ffffff2e!important}.info{margin-top:22px;font-size:13px;opacity:.72}
    .gear{position:absolute;right:24px;top:22px;width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:#17683f;font-size:24px;cursor:pointer}
    .mask{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.mask.show{display:flex}.modal{width:min(390px,100%);background:#fff;color:#193328;border-radius:20px;padding:22px}.modal h2{margin:0 0 18px;text-align:center}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 4px;border-bottom:1px solid #e7ece9}.label b{display:block;font-size:15px}.label span{font-size:12px;color:#819087}
    .switch{width:52px;height:30px;border-radius:20px;background:#c8d1cc;padding:3px;cursor:pointer;flex:none}.switch.on{background:#15965a}.dot{width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.switch.on .dot{transform:translateX(22px)}
    .range-wrap{display:flex;align-items:center;gap:8px;flex:none}.range-wrap input{width:130px;accent-color:#15965a}.range-value{width:40px;text-align:right;color:#557263;font-size:12px;font-variant-numeric:tabular-nums}
    .close{width:100%;height:46px;border:0;border-radius:14px;background:#eef2ef;color:#315143;font-weight:800;margin-top:16px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-height:48vh;overflow:auto}.lv{height:42px;border:0;border-radius:10px;background:#087b40;color:#fff;font-weight:800;cursor:pointer}.lv.cur{outline:3px solid #ffbf45}
  </style>
</head>
<body>
  <main class="main">
    <button class="gear" id="gear" aria-label="设置">⚙</button><div class="logo">🃏</div><h1>卡牌分类消除</h1>
    <div class="sub" id="progress">正在读取进度…</div><div class="menu"><button class="start" id="start">开始游戏</button><button class="secondary" id="choose">关卡选择</button><button class="settings" id="openSettings">设置</button></div>
    <div class="info">分类 · 记忆 · 判断 · 连续收集</div>
  </main>
  <div class="mask" id="mask"><div class="modal"><h2>选择关卡</h2><div class="levels" id="levels"></div><button class="close" id="close">关闭</button></div></div>
  <div class="mask" id="settingsMask"><div class="modal"><h2>游戏设置</h2>
    <div class="row"><div class="label"><b>背景音乐</b><span>Cheerful March</span></div><div class="range-wrap"><input id="musicVolumeRange" type="range" min="0" max="100" value="28"><span class="range-value" id="musicVolumeValue">28%</span></div></div>
    <div class="row"><div class="label"><b>操作音效</b><span>移动、抽牌与提示</span></div><div class="range-wrap"><input id="sfxVolumeRange" type="range" min="0" max="100" value="100"><span class="range-value" id="sfxVolumeValue">100%</span></div></div>
    <div class="row"><div class="label"><b>震动反馈</b><span>支持的设备提供轻微反馈</span></div><div class="switch on" id="vibration"><div class="dot"></div></div></div>
    <div class="row"><div class="label"><b>确认退出</b><span>离开当前关卡前进行确认</span></div><div class="switch on" id="confirmExit"><div class="dot"></div></div></div>
    <button class="close" id="closeSettings">完成</button>
  </div></div>
  <script src="utils/audio.js?v=20260831-04"></script>
  <script>
    const KEY='spider_save', $=id=>document.getElementById(id);
    const DEFAULTS={musicVolume:28,sfxVolume:100,vibration:true,confirmExit:true};
    function load(){try{return JSON.parse(localStorage.getItem(KEY))||{maxUnlocked:1,settings:{}}}catch(_){return{maxUnlocked:1,settings:{}}}}
    function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(_){} }
    function getSettings(){const raw=load().settings||{};return{musicVolume:clamp(raw.musicVolume===undefined?(raw.volume===undefined?28:raw.volume):raw.musicVolume),sfxVolume:clamp(raw.sfxVolume===undefined?(raw.sound===false?0:100):raw.sfxVolume),vibration:raw.vibration===undefined?true:!!raw.vibration,confirmExit:raw.confirmExit===undefined?true:!!raw.confirmExit}}
    function clamp(v){const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):0}
    function persistAudio(){const s=getSettings();GameAudio.sync({musicVolume:s.musicVolume,sfxVolume:s.sfxVolume});return s}
    function sync(){const d=load(),m=Math.max(1,Number(d.maxUnlocked)||1);$('progress').textContent='当前最高关卡：第 '+m+' 关';$('start').textContent='开始游戏 · 第 '+m+' 关';return m}
    function openLevels(){const m=sync();$('levels').innerHTML='';for(let i=1;i<=m;i++){const b=document.createElement('button');b.className='lv'+(i===m?' cur':'');b.textContent=i;b.onclick=()=>location.href='spider.html?level='+i;$('levels').appendChild(b)}$('mask').classList.add('show')}
    function setSwitch(id,key){const d=load();d.settings=d.settings||{};d.settings[key]=!(d.settings[key]===undefined?true:!!d.settings[key]);save(d);syncSettings();}
    function syncSettings(){const d=load(),s=d.settings||{},music=clamp(s.musicVolume===undefined?(s.volume===undefined?28:s.volume):s.musicVolume),sfx=clamp(s.sfxVolume===undefined?(s.sound===false?0:100):s.sfxVolume);$('musicVolumeRange').value=music;$('musicVolumeValue').textContent=music+'%';$('sfxVolumeRange').value=sfx;$('sfxVolumeValue').textContent=sfx+'%';['vibration','confirmExit'].forEach(k=>$(k).className='switch '+((s[k]===undefined?true:!!s[k])?'on':''));GameAudio.sync({musicVolume:music,sfxVolume:sfx});}
    function openSettings(){$('settingsMask').classList.add('show');syncSettings()}
    $('start').onclick=()=>location.href='spider.html?level='+sync();$('choose').onclick=openLevels;$('close').onclick=()=>$('mask').classList.remove('show');$('openSettings').onclick=openSettings;$('gear').onclick=openSettings;$('closeSettings').onclick=()=>$('settingsMask').classList.remove('show');
    $('musicVolumeRange').oninput=e=>{const d=load();d.settings=d.settings||{};d.settings.musicVolume=clamp(e.target.value);save(d);syncSettings()};$('sfxVolumeRange').oninput=e=>{const d=load();d.settings=d.settings||{};d.settings.sfxVolume=clamp(e.target.value);save(d);syncSettings()};$('vibration').onclick=()=>setSwitch('vibration','vibration');$('confirmExit').onclick=()=>setSwitch('confirmExit','confirmExit');
    GameAudio.bindGesture();persistAudio();sync();
  </script>
</body>
</html>
